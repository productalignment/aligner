name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate -- .
      - run: npm run validate -- examples/tidy
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Railway's image builds and answers
        run: |
          docker build -t aligner .
          docker run -d --name aligner -p 8080:8080 aligner
          for i in $(seq 30); do curl -fs localhost:8080/health && exit 0; sleep 1; done
          docker logs aligner; exit 1
